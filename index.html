<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D to 3D Animation Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://unpkg.com/@tensorflow/tfjs"></script>
    <script src="https://unpkg.com/@tensorflow-models/posenet"></script>
</head>
<body class="bg-gradient-to-br from-teal-500 to-cyan-600 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-2xl p-6">
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">2D Drawing to 3D Animation Converter</h1>
            
            <!-- Upload Section -->
            <div class="mb-8">
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center" id="dropZone">
                    <i class="bi bi-cloud-upload text-5xl text-gray-400"></i>
                    <p class="mt-4 text-gray-600">Drag and drop your 2D drawing here or</p>
                    <input type="file" id="fileInput" accept="image/*" class="hidden">
                    <button onclick="document.getElementById('fileInput').click()" class="mt-4 bg-teal-500 text-white px-6 py-2 rounded-lg hover:bg-teal-600 transition-colors">
                        Choose File
                    </button>
                </div>
            </div>

            <!-- Canvas Section -->
            <div class="relative mb-8 hidden" id="canvasContainer">
                <canvas id="drawingCanvas" class="border rounded-lg w-full"></canvas>
                <div class="absolute top-4 right-4 space-x-2">
                    <button id="undoBtn" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700">
                        <i class="bi bi-arrow-counterclockwise"></i> Undo
                    </button>
                    <button id="clearBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">
                        <i class="bi bi-trash"></i> Clear
                    </button>
                </div>
            </div>

            <!-- Controls Section -->
            <div class="space-y-4 hidden" id="controlsSection">
                <div class="flex justify-between items-center">
                    <div class="space-x-2">
                        <button class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600" id="addPointBtn">
                            <i class="bi bi-plus-circle"></i> Add Point
                        </button>
                        <button class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600" id="connectPointsBtn">
                            <i class="bi bi-link"></i> Connect Points
                        </button>
                    </div>
                    <button class="bg-purple-500 text-white px-6 py-2 rounded-lg hover:bg-purple-600" id="generateBtn">
                        <i class="bi bi-play-circle"></i> Generate Animation
                    </button>
                </div>
            </div>

            <!-- Preview Section -->
            <div class="hidden" id="previewSection">
                <h2 class="text-2xl font-semibold mb-4">Animation Preview</h2>
                <div class="border rounded-lg p-4 bg-gray-100">
                    <canvas id="previewCanvas" class="w-full"></canvas>
                </div>
                <div class="mt-4 flex justify-end space-x-2">
                    <button class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600" id="editBtn">
                        <i class="bi bi-pencil"></i> Edit
                    </button>
                    <button class="bg-teal-500 text-white px-4 py-2 rounded-lg hover:bg-teal-600" id="downloadBtn">
                        <i class="bi bi-download"></i> Download
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let uploadedImage = null;
        let points = [];
        let connections = [];
        let isAddingPoints = false;
        let isConnectingPoints = false;
        
        // File Upload Handling
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const canvasContainer = document.getElementById('canvasContainer');
        const controlsSection = document.getElementById('controlsSection');
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');

        fileInput.addEventListener('change', handleFileUpload);
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-teal-500');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-teal-500');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-teal-500');
            const file = e.dataTransfer.files[0];
            handleFile(file);
        });

        function handleFileUpload(e) {
            const file = e.target.files[0];
            handleFile(file);
        }

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please upload an image file');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImage = new Image();
                uploadedImage.onload = () => {
                    canvasContainer.classList.remove('hidden');
                    controlsSection.classList.remove('hidden');
                    dropZone.classList.add('hidden');
                    
                    // Set canvas size
                    canvas.width = uploadedImage.width;
                    canvas.height = uploadedImage.height;
                    drawImage();
                };
                uploadedImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function drawImage() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(uploadedImage, 0, 0);
            drawPoints();
            drawConnections();
        }

        // Point and Connection Management
        canvas.addEventListener('click', (e) => {
            if (isAddingPoints) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                points.push({ x, y });
                drawImage();
            }
        });

        let selectedPoints = [];
        canvas.addEventListener('click', (e) => {
            if (isConnectingPoints) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const clickedPoint = points.find(p => 
                    Math.hypot(p.x - x, p.y - y) < 10
                );

                if (clickedPoint) {
                    selectedPoints.push(clickedPoint);
                    if (selectedPoints.length === 2) {
                        connections.push([...selectedPoints]);
                        selectedPoints = [];
                        drawImage();
                    }
                }
            }
        });

        function drawPoints() {
            ctx.fillStyle = 'red';
            points.forEach(point => {
                ctx.beginPath();
                ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawConnections() {
            ctx.strokeStyle = 'blue';
            ctx.lineWidth = 2;
            connections.forEach(([p1, p2]) => {
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            });
        }

        // Button Event Listeners
        document.getElementById('addPointBtn').addEventListener('click', () => {
            isAddingPoints = !isAddingPoints;
            isConnectingPoints = false;
            document.getElementById('addPointBtn').classList.toggle('bg-blue-700');
        });

        document.getElementById('connectPointsBtn').addEventListener('click', () => {
            isConnectingPoints = !isConnectingPoints;
            isAddingPoints = false;
            document.getElementById('connectPointsBtn').classList.toggle('bg-green-700');
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            points = [];
            connections = [];
            drawImage();
        });

        document.getElementById('generateBtn').addEventListener('click', async () => {
            // Simulate animation generation
            const previewSection = document.getElementById('previewSection');
            previewSection.classList.remove('hidden');
            
            // Here we would normally:
            // 1. Send the image, points, and connections to the server
            // 2. Process using AI/ML to generate 3D animation
            // 3. Receive and display the animation
            
            try {
                const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/ai', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer qlHchVh8EfWuDw9LEaklj0cCMt52',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: [
                            {
                                role: 'user',
                                content: [
                                    {
                                        type: 'text',
                                        text: 'Generate 3D animation from this 2D drawing with skeleton points'
                                    },
                                    {
                                        type: 'image_url',
                                        image_url: {
                                            url: canvas.toDataURL()
                                        }
                                    }
                                ]
                            }
                        ]
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    alert('Animation generated successfully! Preview available.');
                } else {
                    throw new Error('Failed to generate animation');
                }
            } catch (error) {
                alert('Error generating animation: ' + error.message);
            }
        });

        // Initialize the canvas size
        function initCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetWidth * 0.75; // 4:3 aspect ratio
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
